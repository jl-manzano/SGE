<!-- Navegación -->
<nav class="navbar">
  <button [class.active]="vistaActual === 'tabla'" (click)="mostrarTabla()">Tabla</button>
  <button [class.active]="vistaActual === 'formulario'" (click)="mostrarFormulario()">Formulario</button>
  <button [class.active]="vistaActual === 'lista'" (click)="mostrarLista()">Listado</button>
  <button [class.active]="vistaActual === 'reactivo'" (click)="mostrarFormularioReactivo()">Formulario Reactivo</button>
  <button [class.active]="vistaActual === 'material'" (click)="mostrarMaterialComponents()">Material Components</button>
  <button [class.active]="vistaActual === 'material-form'" (click)="mostrarFormularioMaterial()">Formulario Material</button>
</nav>

<!-- Mostrar componentes según la vista actual -->
<app-tabla-personas 
  *ngIf="vistaActual === 'tabla'"
  [personas]="personas"
  (personaEliminada)="eliminarPersona($event)">
</app-tabla-personas>

<app-formulario-persona
  *ngIf="vistaActual === 'formulario'"
  (personaCreada)="addPersona($event)">
</app-formulario-persona>

<app-lista-personas
  *ngIf="vistaActual === 'lista'"
  [personas]="personas"
  (personaEliminada)="eliminarPersona($event)">
</app-lista-personas>

<app-formulario-reactivo
  *ngIf="vistaActual === 'reactivo'">
</app-formulario-reactivo>

<app-material-components
  *ngIf="vistaActual === 'material'">
</app-material-components>

<app-formulario-material
  *ngIf="vistaActual === 'material-form'">
</app-formulario-material>
