<h2>Formulario Reactivo (Ejercicio 2)</h2>

<div class="formulario-container">
  <form [formGroup]="formulario" (ngSubmit)="saluda()">
    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input 
        type="text" 
        id="nombre" 
        formControlName="nombre"
        placeholder="Escribe tu nombre"
        [class.error]="formulario.controls['nombre'].invalid && formulario.controls['nombre'].touched">
      
      <div class="errores" *ngIf="formulario.controls['nombre'].invalid && formulario.controls['nombre'].touched">
        <div *ngIf="formulario.controls['nombre'].errors?.['required']">
          ⚠️ El campo no puede estar vacío
        </div>
        <div *ngIf="formulario.controls['nombre'].errors?.['minlength']">
          ⚠️ El campo no puede tener menos de cuatro caracteres
        </div>
      </div>
    </div>

    <div class="form-group">
      <label for="apellidos">Apellidos</label>
      <input 
        type="text" 
        id="apellidos" 
        formControlName="apellidos"
        placeholder="Escribe tus apellidos"
        [class.error]="formulario.controls['apellidos'].invalid && formulario.controls['apellidos'].touched">
      
      <div class="errores" *ngIf="formulario.controls['apellidos'].invalid && formulario.controls['apellidos'].touched">
        <div *ngIf="formulario.controls['apellidos'].errors?.['required']">
          ⚠️ Los apellidos son obligatorios
        </div>
      </div>
    </div>

    <button 
      type="submit" 
      class="btn-saludar" 
      [disabled]="formulario.invalid">
      👋 Saludar
    </button>
  </form>
</div>
