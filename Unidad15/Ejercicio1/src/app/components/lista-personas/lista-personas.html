<h2>Listado de personas</h2>
<ul class="heroes">
  <li *ngFor="let p of personas; let i = index">
    <button type="button">
      <span class="badge">{{ i + 1 }}</span>
      <span class="name">{{ p.nombre }} {{ p.apellidos }}</span>
      <button type="button" (click)="eliminarPersona(i)">Eliminar</button>
    </button>
  </li>
</ul>

<!-- Botón para volver a la tabla -->
<a routerLink="/">Volver a la tabla</a>
