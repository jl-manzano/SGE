<h2>Formulario Angular Material</h2>

<div class="main-div">
    <mat-card class="formularioCard">
        <mat-card-header>
            <div class="card-header-content">
                <mat-icon class="header-icon">account_circle</mat-icon>
                <mat-card-title>Formulario Reactivo</mat-card-title>
                <mat-card-subtitle>Completa tus datos personales</mat-card-subtitle>
            </div>
        </mat-card-header>

        <mat-card-content>
            <form [formGroup]="formulario" class="formulario-material">
                <mat-form-field appearance="outline" class="campo-completo">
                    <mat-label>Nombre</mat-label>
                    <input matInput placeholder="Ej: Juan" formControlName="nombre">
                    <mat-icon matPrefix>person</mat-icon>
                    <mat-hint>Mínimo 4 caracteres</mat-hint>
                    <mat-error *ngIf="formulario.controls['nombre'].errors?.['required']">
                        El nombre es <strong>obligatorio</strong>
                    </mat-error>
                    <mat-error *ngIf="formulario.controls['nombre'].errors?.['minlength']">
                        El nombre debe tener al menos <strong>4 caracteres</strong>
                    </mat-error>
                </mat-form-field>
                
                <mat-form-field appearance="outline" class="campo-completo">
                    <mat-label>Apellidos</mat-label>
                    <input matInput placeholder="Ej: García López" formControlName="apellidos">
                    <mat-icon matPrefix>badge</mat-icon>
                    <mat-hint>Apellido completo</mat-hint>
                    <mat-error *ngIf="formulario.controls['apellidos'].errors?.['required']">
                        Los apellidos son <strong>obligatorios</strong>
                    </mat-error>
                </mat-form-field>
            </form>
        </mat-card-content>

        <mat-card-actions align="end">
            <button 
                (click)="saluda()" 
                [disabled]="formulario.invalid" 
                mat-raised-button 
                color="primary"
                class="btn-saludar">
                <mat-icon>waving_hand</mat-icon>
                Saludar
            </button>
        </mat-card-actions>
    </mat-card> 
</div>
