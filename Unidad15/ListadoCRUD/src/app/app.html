@if (isLoading()) {
  <div class="loading-container">
    <div class="logo-loader">
      <span class="logo-loader-text">HR</span>
    </div>
    <div class="spinner"></div>
    <p class="loading-text">Cargando aplicación...</p>
    <p class="loading-subtext">Preparando tu espacio de trabajo</p>
  </div>
} @else if (error()) {
  <div class="error-container">
    <div class="error-icon">
      <span class="error-icon-text">⚠️</span>
    </div>
    <h2 class="error-title">Error al inicializar</h2>
    <p class="error-detail">{{ error() }}</p>
  </div>
} @else {
  <router-outlet />
}
